name: Generate Developer Journey

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate Developer Journey
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/developer_journey.py

      - name: Deploy Developer Journey to output branch
        run: |
          cp developer-journey.svg /tmp/developer-journey.svg

          git fetch origin output
          git checkout output

          cp /tmp/developer-journey.svg developer-journey.svg

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add developer-journey.svg

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Developer Journey"
            git push origin output
          fi
